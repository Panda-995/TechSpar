name: Docker 双架构构建

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 v0.4.1),留空则只打 latest'
        required: false
        default: ''
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算标签
        id: meta
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          TAGS_API="ghcr.io/panda-995/techspar-api:latest"
          TAGS_WEB="ghcr.io/panda-995/techspar-web:latest"
          if [ -n "$VERSION" ]; then
            TAGS_API=$(printf '%s\n%s' "$TAGS_API" "ghcr.io/panda-995/techspar-api:${VERSION}")
            TAGS_WEB=$(printf '%s\n%s' "$TAGS_WEB" "ghcr.io/panda-995/techspar-web:${VERSION}")
          fi
          printf '%s\n%s\n%s\n' "tags_api<<EOF" "$TAGS_API" "EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n%s\n%s\n' "tags_web<<EOF" "$TAGS_WEB" "EOF" >> "$GITHUB_OUTPUT"
          echo "API tags: $TAGS_API"
          echo "WEB tags: $TAGS_WEB"

      - name: 构建并推送 API 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags_api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: 构建并推送 Web 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags_web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
